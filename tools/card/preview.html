<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XPON ONU Stick card preview</title>
<style>
  /* Home Assistant's default theme colors. */
  .theme-light {
    --primary-color: #009ac7;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --divider-color: rgba(0, 0, 0, 0.12);
    --card-background-color: #ffffff;
    --primary-background-color: #fafafa;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
    --state-icon-color: #44739e;
    color-scheme: light;
  }
  .theme-dark {
    --primary-color: #009ac7;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225, 225, 225, 0.12);
    --card-background-color: #1c1c1c;
    --primary-background-color: #111111;
    --success-color: #43a047;
    --warning-color: #ffa600;
    --error-color: #db4437;
    --state-icon-color: #6f99c9;
    color-scheme: dark;
  }
  html, body { margin: 0; }
  body {
    font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #e8eaed;
    color: #202124;
  }
  .surface { background: var(--primary-background-color); color: var(--primary-text-color); padding: 24px; }

  /* Screenshot mode: one card on the dashboard background. */
  body.shot { background: none; }
  #stage { display: inline-block; }
  #stage xpon-onu-stick-card { display: block; width: var(--card-width, 500px); }

  /* Debug mode. */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 16px;
    background: #fff;
    border-bottom: 1px solid #dadce0;
    font-size: 13px;
  }
  .toolbar strong { font-size: 14px; margin-right: 8px; }
  .toolbar label { display: inline-flex; align-items: center; gap: 6px; }
  .toolbar select, .toolbar input[type="text"], .toolbar button { font: inherit; padding: 4px 8px; }
  .toolbar .spacer { flex: 1; }
  .layout { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  .panel { border-radius: 16px; }
  .panel h2 { margin: 0 0 12px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.7; }
  .panel xpon-onu-stick-card { display: block; width: var(--card-width, 500px); }
  .side { display: flex; flex-direction: column; gap: 16px; width: 320px; }
  .box { background: #fff; border: 1px solid #dadce0; border-radius: 12px; padding: 12px 14px; font-size: 13px; }
  .box h2 { margin: 0 0 8px; font: 600 12px/1 system-ui, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; color: #5f6368; }
  .box label { display: block; margin: 4px 0; }
  #log { margin: 0; max-height: 260px; overflow: auto; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre-wrap; }

  /* Test mode. */
  #tests { position: absolute; left: -10000px; width: 500px; }
  .results { padding: 16px 24px; font: 14px/1.6 system-ui, sans-serif; }
  .results .pass { color: #188038; }
  .results .fail { color: #c5221f; }
</style>
<script src="ha-stubs.js"></script>
<script type="module" src="../../custom_components/xpon_onu_stick/frontend/xpon-onu-stick-card.js"></script>
<script type="module" src="preview.js"></script>
</head>
<body>
<div id="app"></div>
<div id="tests"></div>
</body>
</html>
