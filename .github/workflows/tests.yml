name: Tests

on:
  pull_request:
  push:
    branches: [master]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Lint, formatting, repository checks, and the full pytest suite, including
      # the dashboard card's UI tests in the runner's Chrome.
      - name: Run all checks
        env:
          PYTHON: python
        run: ./scripts/test.sh --setup

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .test-results/
          if-no-files-found: ignore

  hassfest:
    name: Home Assistant validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # The integration's icons ship in its own brand folder, not in home-assistant/brands.
          ignore: brands
          comment: false

  release:
    name: Release tag matches the version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with manifest.json
        run: |
          version="$(jq -r .version custom_components/xpon_onu_stick/manifest.json)"
          if [[ "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error file=custom_components/xpon_onu_stick/manifest.json::Tag $GITHUB_REF_NAME doesn't match manifest version $version."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches manifest.json."
